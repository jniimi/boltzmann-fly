[project]
name = "boltzmann-fly"
version = "0.1.0"
description = "Purchase World on a fly-connectome-masked Boltzmann machine (hobby project)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "torch>=2.10.0",
    "scikit-learn>=1.6.1",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltzmann_fly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
